services:
  - type: web
    name: trello-realtime-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Set to your Upstash Redis connection string
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure JWT key
