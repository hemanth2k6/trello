events {
    worker_connections 1024;
}

http {
    # Upstream backend pool for horizontal scaling
    upstream trello_cluster {
        # ip_hash ensures socket handshakes from a single client consistently hit the same node
        # if fallback transports (polling) are used, while WebSockets broadcast via Redis
        ip_hash;
        server api1:3000;
        server api2:3000;
    }

    server {
        listen 80;

        # Health check endpoint for ingress / load balancer
        location /health {
            proxy_pass http://trello_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket & API Gateway routing
        location / {
            proxy_pass http://trello_cluster;

            # Essential HTTP 1.1 upgrade headers for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy headers for client identification
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-lived real-time persistent connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

