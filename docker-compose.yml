version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: trello
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trello"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trello-network

  # ---------------------------------------------------------------------------
  # Message Broker & Cache (Redis 7) - Backbone for Socket.io Pub/Sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trello-network

  # ---------------------------------------------------------------------------
  # Real-Time WebSocket Server Node 1
  # ---------------------------------------------------------------------------
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: "api-instance-1"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trello
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: trello
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-task-board-jwt-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trello-network

  # ---------------------------------------------------------------------------
  # Real-Time WebSocket Server Node 2 (Horizontal Scaling Replica)
  # ---------------------------------------------------------------------------
  api2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: "api-instance-2"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trello
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: trello
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-task-board-jwt-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trello-network

  # ---------------------------------------------------------------------------
  # Nginx Load Balancer (WebSocket Proxy + ip_hash Sticky Routing)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - trello-network

volumes:
  postgres_data:
  redis_data:

networks:
  trello-network:
    driver: bridge
